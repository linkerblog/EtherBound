# The shared op vocabulary (docs/utils/VISION.md [Sec. 7]). It changes only through a Dev doc.
# `targets` lists the primary target kinds (self, tile, edge, object, actor); an op with no
# targets, like `move`, is never a menu entry. An op without a code handler is never offered.

