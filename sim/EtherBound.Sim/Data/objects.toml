# The v1 object kind catalog (docs/Dev-012.md [Sec. 2]). Kinds are data: a new object is a new
# row here, never new code. Flags and components are what handlers read; kind names are not.
# A `solid` kind fills `height` half-metre cells above its resting surface; a `surface` kind's
# top is a standing and placing surface. `bulk` is in litres and decides two-handed carrying.

